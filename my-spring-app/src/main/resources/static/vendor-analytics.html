<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Analytics | Wedding Planner</title>
    <link href="bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --gold:#c9a84c; --cream:#fdf8f2; --dark:#1a1209; --text-muted:#7a6a50; }
        body { background: var(--cream); color: var(--dark); font-family: Montserrat, sans-serif; }
        .panel { background:#fff; border:1px solid rgba(201,168,76,.15); padding:24px; }
        .stat { border:1px solid rgba(201,168,76,.15); padding:18px; background:#fff; }
        .small-muted { color: var(--text-muted); font-size: .9rem; }
        .btn-dark { background:var(--dark); border-color:var(--dark); border-radius:0; }
        .btn-outline-dark { border-radius:0; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <div class="text-uppercase" style="letter-spacing:5px;color:var(--gold);font-size:.65rem;">Analytics</div>
            <h1 class="display-6" style="font-family:Georgia,serif;">Dashboard Insights</h1>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-dark" href="/vendor/dashboard">Dashboard</a>
            <button class="btn btn-dark" onclick="loadAnalytics()">Reload</button>
        </div>
    </div>
    <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="stat"><div class="small-muted">Total Bookings</div><h3 id="totalBookings">0</h3></div></div>
        <div class="col-md-4"><div class="stat"><div class="small-muted">Pending Requests</div><h3 id="pendingRequests">0</h3></div></div>
        <div class="col-md-4"><div class="stat"><div class="small-muted">Monthly Earnings</div><h3 id="monthlyEarnings">0</h3></div></div>
        <div class="col-md-4"><div class="stat"><div class="small-muted">Profile Views</div><h3 id="profileViews">0</h3></div></div>
        <div class="col-md-4"><div class="stat"><div class="small-muted">Review Score</div><h3 id="reviewScoreAverage">0</h3></div></div>
        <div class="col-md-4"><div class="stat"><div class="small-muted">Review Count</div><h3 id="reviewCount">0</h3></div></div>
    </div>
    <div class="panel mb-4">
        <h4>Booking Trends</h4>
        <pre id="bookingTrends" class="mb-0">Loading...</pre>
    </div>
    <div class="panel">
        <h4>Revenue Trends</h4>
        <pre id="revenueTrends" class="mb-0">Loading...</pre>
    </div>
</div>
<script>
    const email = localStorage.getItem('userEmail') || '';
    function loadAnalytics() {
        fetch(`/api/vendor/analytics/dashboard?email=${encodeURIComponent(email)}`)
            .then(r => r.json())
            .then(data => {
                document.getElementById('totalBookings').textContent = data.totalBookings ?? 0;
                document.getElementById('pendingRequests').textContent = data.pendingRequests ?? 0;
                document.getElementById('monthlyEarnings').textContent = data.monthlyEarnings ?? 0;
                document.getElementById('profileViews').textContent = data.profileViews ?? 0;
                document.getElementById('reviewScoreAverage').textContent = data.reviewScoreAverage ?? 0;
                document.getElementById('reviewCount').textContent = data.reviewCount ?? 0;
            });
        fetch(`/api/vendor/analytics/bookings?email=${encodeURIComponent(email)}`)
            .then(r => r.json())
            .then(data => document.getElementById('bookingTrends').textContent = JSON.stringify(data, null, 2));
        fetch(`/api/vendor/analytics/revenue?email=${encodeURIComponent(email)}`)
            .then(r => r.json())
            .then(data => document.getElementById('revenueTrends').textContent = JSON.stringify(data, null, 2));
    }
    loadAnalytics();
</script>
</body>
</html>
