<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviews - Wedding Planner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 40px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Summary Card */
        .summary-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .rating-display {
            font-size: 3em;
            color: #764ba2;
            font-weight: bold;
            margin: 20px 0;
        }

        .star-display {
            color: #ffc107;
            font-size: 1.5em;
            margin: 10px 0;
        }

        .total-reviews {
            color: #666;
            font-size: 1.1em;
            margin-top: 20px;
        }

        .rating-distribution {
            margin-top: 30px;
            text-align: left;
        }

        .distribution-row {
            display: flex;
            align-items: center;
            margin: 10px 0;
            font-size: 0.9em;
        }

        .distribution-label {
            width: 30px;
            color: #666;
        }

        .distribution-bar {
            flex: 1;
            height: 20px;
            background: #f0f0f0;
            border-radius: 10px;
            margin: 0 10px;
            overflow: hidden;
        }

        .distribution-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.3s ease;
        }

        .distribution-count {
            width: 30px;
            text-align: right;
            color: #666;
        }

        /* Reviews Section */
        .reviews-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .reviews-section h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 1.8em;
        }

        .btn-tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
            padding: 0 0 20px 0;
        }

        .btn-tab {
            background: none;
            border: none;
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-tab:hover {
            color: #764ba2;
        }

        .btn-tab.active {
            color: #764ba2;
            border-bottom-color: #764ba2;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Review Form */
        .review-form {
            background: #f9f9f9;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
            border: 1px solid #e0e0e0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 0.95em;
        }

        .star-rating {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .star {
            font-size: 2em;
            cursor: pointer;
            color: #ddd;
            transition: color 0.2s ease;
        }

        .star:hover,
        .star.active {
            color: #ffc107;
        }

        .rating-value {
            color: #666;
            font-size: 0.9em;
            margin-left: 10px;
        }

        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 0.95em;
            resize: vertical;
            min-height: 120px;
        }

        .form-group textarea:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 5px rgba(118, 75, 162, 0.2);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 5px;
            font-size: 0.95em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(118, 75, 162, 0.3);
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
        }

        .btn-secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Review Card */
        .review-item {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #764ba2;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .review-meta {
            flex: 1;
        }

        .review-author {
            font-weight: 600;
            color: #333;
            font-size: 1em;
            margin-bottom: 5px;
        }

        .review-date {
            color: #999;
            font-size: 0.85em;
        }

        .review-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8em;
            background: #e0e0e0;
            color: #333;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-small:hover {
            background: #d0d0d0;
        }

        .btn-small.danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-small.danger:hover {
            background: #ee5a52;
        }

        .review-rating {
            color: #ffc107;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .review-text {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .vendor-reply {
            background: white;
            padding: 15px;
            border-left: 3px solid #667eea;
            margin-top: 15px;
            border-radius: 4px;
        }

        .vendor-reply-header {
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
            font-size: 0.9em;
        }

        .vendor-reply-text {
            color: #555;
            font-size: 0.9em;
            line-height: 1.5;
        }

        .vendor-reply-date {
            color: #999;
            font-size: 0.8em;
            margin-top: 8px;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        .alert {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .char-count {
            color: #999;
            font-size: 0.85em;
            margin-top: 5px;
        }

        .login-prompt {
            background: #fff3cd;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 30px;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .login-prompt a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-prompt a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>💬 Vendor Reviews</h1>
            <p>Read & Share Experiences</p>
        </div>

        <!-- Alert Messages -->
        <div id="alert" class="alert"></div>

        <!-- Main Content -->
        <div class="content-grid">
            <!-- Summary Card -->
            <div class="summary-card">
                <h3>Rating Summary</h3>
                <div class="rating-display" id="avgRating">—</div>
                <div class="star-display" id="starDisplay"></div>
                <div class="total-reviews">
                    <span id="totalReviews">0</span> Reviews
                </div>
                <div class="rating-distribution" id="distribution"></div>
            </div>

            <!-- Reviews Section -->
            <div class="reviews-section">
                <!-- Login Prompt -->
                <div id="loginPrompt" class="login-prompt" style="display: none;">
                    Please <a href="login.html">login</a> to submit a review.
                </div>

                <!-- Tabs -->
                <div class="btn-tab-group">
                    <button class="btn-tab active" data-tab="all-reviews">All Reviews</button>
                    <button class="btn-tab" data-tab="my-reviews">My Reviews</button>
                    <button class="btn-tab" data-tab="submit-review">Submit Review</button>
                </div>

                <!-- All Reviews Tab -->
                <div id="all-reviews" class="tab-content active">
                    <div id="allReviewsList" class="reviews-list">
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <p>No reviews yet. Be the first to review!</p>
                        </div>
                    </div>
                </div>

                <!-- My Reviews Tab -->
                <div id="my-reviews" class="tab-content">
                    <div id="myReviewsList" class="reviews-list">
                        <div class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <p>You haven't written any reviews yet.</p>
                        </div>
                    </div>
                </div>

                <!-- Submit Review Tab -->
                <div id="submit-review" class="tab-content">
                    <form class="review-form" id="reviewForm" style="display: none;">
                        <div class="form-group">
                            <label>Vendor (will be auto-selected)</label>
                            <div style="color: #666; font-size: 0.95em; padding: 10px; background: white; border-radius: 4px;">
                                <span id="vendorDisplay">—</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Rating *</label>
                            <div class="star-rating">
                                <div id="starRating"></div>
                                <span class="rating-value"><span id="ratingValue">0</span>/5</span>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Your Review *</label>
                            <textarea id="reviewText" placeholder="Share your experience... (10-2000 characters)" maxlength="2000"></textarea>
                            <div class="char-count"><span id="charCount">0</span>/2000</div>
                        </div>

                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" id="cancelReview">Cancel</button>
                            <button type="submit" class="btn btn-primary" id="submitReviewBtn">Submit Review</button>
                        </div>
                    </form>

                    <div id="loginPromptForm" class="login-prompt" style="display: none;">
                        Please <a href="login.html">login</a> to submit a review.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Get vendor ID from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const vendorId = urlParams.get('vendorId');

        // Check authentication
        const token = localStorage.getItem('token');
        const userId = localStorage.getItem('userId');
        const isLoggedIn = !!token;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if (!vendorId) {
                showAlert('Vendor ID is required', 'error');
                return;
            }

            initTabs();
            if (isLoggedIn) {
                initReviewForm();
            } else {
                showLoginPromt();
            }

            loadSummary();
            loadAllReviews();
        });

        // ─────────────────────────────────────────
        //  TAB MANAGEMENT
        // ─────────────────────────────────────────

        function initTabs() {
            document.querySelectorAll('.btn-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    const tabName = tab.dataset.tab;
                    switchTab(tabName);
                });
            });
        }

        function switchTab(tabName) {
            // Update active tab button
            document.querySelectorAll('.btn-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

            // Show active content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');

            // Load my reviews when switching
            if (tabName === 'my-reviews' && isLoggedIn) {
                loadMyReviews();
            }
        }

        // ─────────────────────────────────────────
        //  REVIEW FORM
        // ─────────────────────────────────────────

        function initReviewForm() {
            document.getElementById('reviewForm').style.display = 'block';
            document.getElementById('loginPromptForm').style.display = 'none';

            // Star rating selector
            initStarRating();

            // Character counter
            document.getElementById('reviewText').addEventListener('input', (e) => {
                document.getElementById('charCount').textContent = e.target.value.length;
            });

            // Form submission
            document.getElementById('reviewForm').addEventListener('submit', submitReview);
            document.getElementById('cancelReview').addEventListener('click', () => {
                document.getElementById('reviewForm').reset();
                document.getElementById('ratingValue').textContent = '0';
                document.getElementById('charCount').textContent = '0';
                updateStarDisplay(0);
            });

            // Load vendor name
            loadVendorName();
        }

        function showLoginPromt() {
            document.getElementById('loginPrompt').style.display = 'block';
            document.getElementById('loginPromptForm').style.display = 'block';
            document.getElementById('reviewForm').style.display = 'none';
        }

        function initStarRating() {
            const container = document.getElementById('starRating');
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('span');
                star.className = 'star';
                star.textContent = '★';
                star.addEventListener('click', () => {
                    document.getElementById('ratingValue').textContent = i;
                    document.querySelectorAll('#starRating .star').forEach((s, idx) => {
                        s.classList.toggle('active', idx < i);
                    });
                });
                star.addEventListener('mouseover', () => {
                    document.querySelectorAll('#starRating .star').forEach((s, idx) => {
                        s.style.color = idx < i ? '#ffc107' : '#ddd';
                    });
                });
                container.appendChild(star);
            }
            container.addEventListener('mouseout', () => {
                updateStarDisplay(parseInt(document.getElementById('ratingValue').textContent));
            });
        }

        function loadVendorName() {
            fetch(`/api/vendors/${vendorId}`)
                .then(r => r.json())
                .then(data => {
                    if (data.success && data.vendor) {
                        document.getElementById('vendorDisplay').textContent = data.vendor.businessName;
                    }
                })
                .catch(err => console.log('Could not load vendor name'));
        }

        async function submitReview(e) {
            e.preventDefault();

            const rating = parseInt(document.getElementById('ratingValue').textContent);
            const reviewText = document.getElementById('reviewText').value.trim();

            if (rating === 0) {
                showAlert('Please select a rating', 'error');
                return;
            }

            if (reviewText.length < 10) {
                showAlert('Review must be at least 10 characters', 'error');
                return;
            }

            const btn = document.getElementById('submitReviewBtn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            try {
                const response = await fetch('/api/reviews', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        vendorId: parseInt(vendorId),
                        rating: rating,
                        reviewText: reviewText
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showAlert('Review submitted successfully!', 'success');
                    document.getElementById('reviewForm').reset();
                    document.getElementById('ratingValue').textContent = '0';
                    document.getElementById('charCount').textContent = '0';
                    updateStarDisplay(0);
                    loadAllReviews();
                    loadMyReviews();
                    loadSummary();
                    setTimeout(() => switchTab('all-reviews'), 1500);
                } else {
                    showAlert(data.message || 'Error submitting review', 'error');
                }
            } catch (err) {
                showAlert('Error submitting review: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Submit Review';
            }
        }

        function updateStarDisplay(rating) {
            const display = document.querySelectorAll('#starRating .star');
            display.forEach((s, idx) => {
                s.style.color = idx < rating ? '#ffc107' : '#ddd';
            });
        }

        // ─────────────────────────────────────────
        //  LOAD DATA
        // ─────────────────────────────────────────

        async function loadSummary() {
            try {
                const response = await fetch(`/api/reviews/vendor/${vendorId}/summary`);
                const data = await response.json();

                document.getElementById('avgRating').textContent = data.averageRating.toFixed(1);
                document.getElementById('totalReviews').textContent = data.totalReviews;

                // Star display
                const starDisplay = document.getElementById('starDisplay');
                const fullStars = Math.floor(data.averageRating);
                const hasHalf = data.averageRating % 1 >= 0.5;
                let stars = '★'.repeat(fullStars);
                if (hasHalf) stars += '½';
                starDisplay.textContent = stars;

                // Distribution
                const dist = document.getElementById('distribution');
                dist.innerHTML = '';
                const max = Math.max(...Object.values(data.distribution));
                for (let i = 5; i >= 1; i--) {
                    const count = data.distribution[i];
                    const pct = max > 0 ? (count / max) * 100 : 0;
                    dist.innerHTML += `
                        <div class="distribution-row">
                            <div class="distribution-label">${i}★</div>
                            <div class="distribution-bar">
                                <div class="distribution-fill" style="width: ${pct}%"></div>
                            </div>
                            <div class="distribution-count">${count}</div>
                        </div>
                    `;
                }
            } catch (err) {
                console.error('Error loading summary:', err);
            }
        }

        async function loadAllReviews() {
            try {
                const response = await fetch(`/api/reviews/vendor/${vendorId}`);
                const data = await response.json();

                const container = document.getElementById('allReviewsList');
                if (!data.reviews || data.reviews.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📋</div>
                            <p>No reviews yet. Be the first to review!</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = data.reviews.map(review => createReviewCard(review, false)).join('');
            } catch (err) {
                console.error('Error loading reviews:', err);
            }
        }

        async function loadMyReviews() {
            if (!isLoggedIn) {
                document.getElementById('myReviewsList').innerHTML = `
                    <div class="login-prompt">
                        Please <a href="login.html">login</a> to view your reviews.
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch('/api/reviews/my-reviews', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await response.json();

                const container = document.getElementById('myReviewsList');
                if (!data.reviews || data.reviews.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <p>You haven't written any reviews yet.</p>
                        </div>
                    `;
                    return;
                }

                // Filter for current vendor
                const myVendorReviews = data.reviews.filter(r => r.vendorId == vendorId);
                if (myVendorReviews.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">📝</div>
                            <p>You haven't reviewed this vendor yet.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = myVendorReviews.map(review => createReviewCard(review, true)).join('');
                attachReviewActions();
            } catch (err) {
                console.error('Error loading my reviews:', err);
            }
        }

        function createReviewCard(review, isOwn) {
            const date = new Date(review.createdAt).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });

            const replyDate = review.vendorResponseAt ? new Date(review.vendorResponseAt).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            }) : null;

            const actions = isOwn ? `
                <button class="btn-small" data-action="edit" data-id="${review.id}">Edit</button>
                <button class="btn-small danger" data-action="delete" data-id="${review.id}">Delete</button>
            ` : '';

            const reply = review.vendorResponse ? `
                <div class="vendor-reply">
                    <div class="vendor-reply-header">Response from ${review.vendorName}</div>
                    <div class="vendor-reply-text">${review.vendorResponse}</div>
                    <div class="vendor-reply-date">${replyDate}</div>
                </div>
            ` : '';

            return `
                <div class="review-item" data-review-id="${review.id}">
                    <div class="review-header">
                        <div class="review-meta">
                            <div class="review-author">${review.customerName}</div>
                            <div class="review-date">${date}</div>
                        </div>
                        <div class="review-actions">
                            ${actions}
                        </div>
                    </div>
                    <div class="review-rating">${'★'.repeat(review.rating)}${'☆'.repeat(5-review.rating)}</div>
                    <div class="review-text">${escapeHtml(review.reviewText)}</div>
                    ${reply}
                </div>
            `;
        }

        function attachReviewActions() {
            document.querySelectorAll('[data-action]').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const action = e.target.dataset.action;
                    const reviewId = e.target.dataset.id;

                    if (action === 'delete') {
                        if (!confirm('Are you sure you want to delete this review?')) return;
                        await deleteReview(reviewId);
                    }
                });
            });
        }

        async function deleteReview(reviewId) {
            try {
                const response = await fetch(`/api/reviews/${reviewId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const data = await response.json();
                if (data.success) {
                    showAlert('Review deleted successfully', 'success');
                    loadAllReviews();
                    loadMyReviews();
                    loadSummary();
                } else {
                    showAlert(data.message || 'Error deleting review', 'error');
                }
            } catch (err) {
                showAlert('Error: ' + err.message, 'error');
            }
        }

        // ─────────────────────────────────────────
        //  UTILITIES
        // ─────────────────────────────────────────

        function showAlert(message, type = 'info') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type} show`;
            alert.style.display = 'block';

            setTimeout(() => {
                alert.classList.remove('show');
                alert.style.display = 'none';
            }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
