<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Wedding Planner</title>
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #c9a84c;
            --gold-soft: #eadfb8;
            --cream: #fdf8f2;
            --cream-2: #f7efe3;
            --dark: #1a1209;
            --ink: #2d2418;
            --muted: #7a6a50;
            --line: rgba(201, 168, 76, 0.18);
            --shadow: 0 24px 60px rgba(26, 18, 9, 0.14);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Montserrat', sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(201,168,76,0.16), transparent 34%),
                radial-gradient(circle at bottom right, rgba(26,18,9,0.06), transparent 30%),
                linear-gradient(135deg, var(--cream) 0%, #fff 38%, var(--cream-2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .forgot-card {
            width: 100%;
            max-width: 480px;
            background: rgba(255,255,255,0.76);
            backdrop-filter: blur(18px);
            border: 1px solid var(--line);
            box-shadow: var(--shadow);
            border-radius: 28px;
            padding: 34px;
            text-align: center;
        }
        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 300;
            margin-bottom: 8px;
        }
        .subtitle { color: var(--muted); margin-bottom: 28px; line-height: 1.75; }
        .field-label {
            display: block;
            font-size: 0.74rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: var(--muted);
            text-align: left;
        }
        .field-input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid rgba(122, 106, 80, 0.25);
            background: rgba(255,255,255,0.92);
            margin-bottom: 18px;
            outline: none;
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
        }
        .field-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(201,168,76,0.12);
            transform: translateY(-1px);
        }
        .btn-primary-gold,
        .btn-primary-gold:hover {
            background: linear-gradient(135deg, #b08a31, #d6bc63);
            color: #1a1209;
            border: 0;
            border-radius: 16px;
            padding: 14px 18px;
            width: 100%;
            font-weight: 700;
            letter-spacing: 1px;
            box-shadow: 0 18px 40px rgba(201,168,76,0.24);
        }
        .meta-links {
            margin-top: 14px;
        }
        .meta-links a { color: var(--muted); text-decoration: none; font-size: 0.92rem; }
        .meta-links a:hover { color: var(--dark); }
        .alert-box {
            display: none;
            border-radius: 16px;
            margin-bottom: 18px;
        }
        .success-message {
            display: none;
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid rgba(40, 167, 69, 0.2);
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
    <div class="forgot-card">
        <div class="eyebrow" style="color: var(--gold); margin-bottom: 12px;">Reset Password</div>
        <h2 class="title mb-0">Forgot Password</h2>
        <p class="subtitle mb-0">Enter your email address and we'll send you a link to reset your password.</p>

        <div id="alertBox" class="alert alert-danger alert-box" role="alert"></div>
        <div id="successBox" class="success-message">If an account with that email exists, we've sent you a password reset link.</div>

        <form id="forgotForm">
            <label class="field-label" for="email">Email Address</label>
            <input id="email" class="field-input" type="email" placeholder="name@example.com" autocomplete="email" required>

            <button class="btn-primary-gold" type="submit">Send Reset Link</button>
        </form>

        <div class="meta-links">
            <a href="/login.html">Back to Login</a>
        </div>
    </div>

    <script>
        const alertBox = document.getElementById('alertBox');
        const successBox = document.getElementById('successBox');

        function showAlert(message) {
            alertBox.textContent = message;
            alertBox.style.display = 'block';
            successBox.style.display = 'none';
        }

        function showSuccess() {
            alertBox.style.display = 'none';
            successBox.style.display = 'block';
        }

        function hideMessages() {
            alertBox.style.display = 'none';
            successBox.style.display = 'none';
        }

        document.getElementById('forgotForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            hideMessages();

            const email = document.getElementById('email').value.trim();

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (!response.ok) {
                    showAlert(data.message || 'Failed to send reset email.');
                    return;
                }

                showSuccess();
            } catch (error) {
                showAlert('Unable to connect to the server. Please try again.');
            }
        });
    </script>
</body>
</html>
