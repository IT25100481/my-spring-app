<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Bookings | Wedding Planner</title>
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        body { background: var(--cream); color: var(--dark); font-family: 'Montserrat', sans-serif; }
        .hero { padding: 70px 0 30px; text-align: center; }
        .tag { color: var(--gold); letter-spacing: 5px; text-transform: uppercase; font-size: 0.65rem; }
        .title { font-family: 'Cormorant Garamond', serif; font-size: 3.2rem; font-weight: 300; }
        .panel { background: #fff; border: 1px solid rgba(201,168,76,0.15); padding: 24px; }
        .booking-card { border: 1px solid rgba(201,168,76,0.15); padding: 18px; margin-bottom: 14px; background: #fff; }
        .small-muted { color: var(--text-muted); font-size: 0.9rem; }
        .btn-dark { background: var(--dark); border-color: var(--dark); border-radius: 0; }
        .btn-outline-dark { border-radius: 0; }
        .field-input { width: 100%; border: 1px solid #d8d1c4; padding: 10px 12px; margin-bottom: 12px; }
    </style>
</head>
<body>
<div class="container">
    <section class="hero">
        <div class="tag">Booking Management</div>
        <h1 class="title">Incoming Bookings</h1>
        <p class="small-muted">Accept, decline, negotiate, confirm, and complete booking requests.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
            <a class="btn btn-outline-dark" href="/vendor/dashboard">Back to Dashboard</a>
            <button class="btn btn-dark" onclick="loadBookings()">Reload</button>
        </div>
    </section>

    <div id="messageBox" class="alert d-none"></div>

    <div class="row g-4">
        <div class="col-lg-12">
            <div class="panel">
                <h3 class="mb-4" style="font-family:'Cormorant Garamond', serif;">Booking Queue</h3>
                <div class="row g-2 mb-4">
                    <div class="col-md-4"><input class="field-input" id="rangeStart" type="date"></div>
                    <div class="col-md-4"><input class="field-input" id="rangeEnd" type="date"></div>
                    <div class="col-md-4"><button class="btn btn-dark w-100" onclick="loadUpcoming()">Load Upcoming</button></div>
                </div>
                <div id="bookingsList"></div>
            </div>
        </div>
    </div>
</div>
<script>
    const authToken = localStorage.getItem('authToken') || '';

    function showMessage(message, type = 'success') {
        const box = document.getElementById('messageBox');
        box.className = `alert alert-${type}`;
        box.textContent = message;
        box.classList.remove('d-none');
    }

    function getEmail() {
        return localStorage.getItem('userEmail') || '';
    }

    function authHeaders(extra = {}) {
        const headers = { ...extra };
        if (authToken) {
            headers.Authorization = `Bearer ${authToken}`;
        }
        return headers;
    }

    function authFetch(url, options = {}) {
        return fetch(url, {
            ...options,
            headers: authHeaders(options.headers || {})
        });
    }

    function action(url, method = 'POST') {
        return fetch(url, { method }).then(response => response.json());
    }

    function renderBookings(bookings) {
        const list = document.getElementById('bookingsList');
        list.innerHTML = '';
        if (!bookings.length) {
            list.innerHTML = '<p class="small-muted mb-0">No bookings found.</p>';
            return;
        }
        bookings.forEach(booking => {
            const card = document.createElement('div');
            card.className = 'booking-card';
            card.innerHTML = `
                <div class="d-flex justify-content-between flex-wrap gap-3">
                    <div>
                        <h5 class="mb-1">Booking #${booking.id}</h5>
                        <div class="small-muted">Event date: ${booking.eventDate || ''}</div>
                        <div class="small-muted">Status: ${booking.status || ''}</div>
                        <div class="small-muted">Payment: ${booking.paymentStatus || ''}</div>
                        <div class="small-muted">Location: ${booking.eventLocation || ''}</div>
                        <div class="small-muted">Details: ${booking.eventDetails || ''}</div>
                    </div>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-outline-dark btn-sm" onclick="updateBooking('${booking.id}', 'accept')">Accept</button>
                        <button class="btn btn-outline-dark btn-sm" onclick="updateBooking('${booking.id}', 'decline')">Decline</button>
                        <button class="btn btn-outline-dark btn-sm" onclick="negotiateBooking('${booking.id}')">Negotiate</button>
                        <button class="btn btn-outline-dark btn-sm" onclick="updateBooking('${booking.id}', 'confirm')">Confirm</button>
                        <button class="btn btn-outline-dark btn-sm" onclick="updateBooking('${booking.id}', 'complete')">Complete</button>
                        <button class="btn btn-outline-dark btn-sm" onclick="updateBooking('${booking.id}', 'cancel')">Cancel</button>
                    </div>
                </div>
            `;
            list.appendChild(card);
        });
    }

    function loadBookings() {
        const email = getEmail();
        authFetch(`/api/vendor/bookings?email=${encodeURIComponent(email)}`)
            .then(response => response.json())
            .then(renderBookings)
            .catch(() => showMessage('Could not load bookings.', 'danger'));
    }

    function loadUpcoming() {
        const email = getEmail();
        const startDate = document.getElementById('rangeStart').value;
        const endDate = document.getElementById('rangeEnd').value;
        authFetch(`/api/vendor/bookings/upcoming?email=${encodeURIComponent(email)}&startDate=${startDate}&endDate=${endDate}`)
            .then(response => response.json())
            .then(renderBookings)
            .catch(() => showMessage('Could not load upcoming bookings.', 'danger'));
    }

    function updateBooking(id, actionName) {
        const email = getEmail();
        authFetch(`/api/vendor/bookings/${id}/${actionName}?email=${encodeURIComponent(email)}`, { method: 'POST' })
            .then(response => response.json())
            .then(() => {
                showMessage(`Booking ${actionName}ed successfully.`, 'success');
                loadBookings();
            })
            .catch(() => showMessage('Could not update booking.', 'danger'));
    }

    function negotiateBooking(id) {
        const email = getEmail();
        const quotedPrice = prompt('Enter quoted price:');
        const notes = prompt('Enter negotiation notes:');
        if (!quotedPrice) return;
        authFetch(`/api/vendor/bookings/${id}/negotiate?email=${encodeURIComponent(email)}&quotedPrice=${encodeURIComponent(quotedPrice)}&notes=${encodeURIComponent(notes || '')}`, { method: 'POST' })
            .then(response => response.json())
            .then(() => {
                showMessage('Negotiation saved.', 'success');
                loadBookings();
            })
            .catch(() => showMessage('Could not negotiate booking.', 'danger'));
    }

    loadBookings();
</script>
</body>
</html>
