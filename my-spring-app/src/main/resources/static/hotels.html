<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Premium Venues | Wedding Planner</title>
    <!-- Include same Head links as Index -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --cream: #fdf8f2; --dark: #1a1209; }
        body { background: var(--cream); font-family: 'Montserrat', sans-serif; color: var(--dark); }
        .navbar { background: var(--dark); padding: 18px 40px; }
        .navbar-brand { font-family: 'Cormorant Garamond', serif; color: var(--gold) !important; letter-spacing: 3px; }
        .hotel-card { background: #fff; border: 1px solid rgba(201,168,76,0.2); transition: 0.4s; }
        .hotel-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        .btn-gold { background: var(--gold); color: white; border-radius: 0; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark"><a class="navbar-brand" href="/">✦ Wedding Planner</a></nav>
<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 style="font-family: 'Cormorant Garamond', serif; font-size: 3rem;">Exquisite <em>Venues</em></h1>
        <p class="text-muted">From coastal retreats to grand ballroom estates.</p>
    </div>
    <div class="row g-4">
        <!-- Iterate your hotels here -->
        <div class="col-md-6" th:each="hotel : ${hotels}">
            <div class="hotel-card d-flex">
                <div style="width: 40%; background: url('https://images.unsplash.com/photo-1566073771259-6a8506099945?w=500') center/cover;"></div>
                <div class="p-4" style="width: 60%;">
                    <h4 style="font-family: 'Cormorant Garamond', serif;" th:text="${hotel.name}">The Grand Heritage</h4>
                    <p class="small text-muted" th:text="${hotel.location}">📍 Colombo, Sri Lanka</p>
                    <hr>
                    <p class="small">Luxury suites, grand ballroom, and beachfront garden.</p>
                    <a href="#" class="btn btn-gold w-100 mt-2">Check Availability</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
