<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Availability | Wedding Planner</title>
    <link href="bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #c9a84c; --cream: #fdf8f2; --dark: #1a1209; --text-muted: #7a6a50; }
        body { background: var(--cream); color: var(--dark); font-family: 'Montserrat', sans-serif; }
        .hero { padding: 70px 0 30px; text-align: center; }
        .tag { color: var(--gold); letter-spacing: 5px; text-transform: uppercase; font-size: 0.65rem; }
        .title { font-family: 'Cormorant Garamond', serif; font-size: 3.2rem; font-weight: 300; }
        .panel { background: #fff; border: 1px solid rgba(201,168,76,0.15); padding: 24px; }
        .field-label { font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        .field-input, .field-select { width: 100%; border: 1px solid #d8d1c4; padding: 10px 12px; margin-bottom: 12px; }
        .availability-item { border: 1px solid rgba(201,168,76,0.15); padding: 14px; margin-bottom: 12px; background: #fff; }
        .small-muted { color: var(--text-muted); font-size: 0.9rem; }
        .btn-dark { background: var(--dark); border-color: var(--dark); border-radius: 0; }
        .btn-outline-dark { border-radius: 0; }
    </style>
</head>
<body>
<div class="container">
    <section class="hero">
        <div class="tag">Availability Management</div>
        <h1 class="title">Calendar & Working Hours</h1>
        <p class="small-muted">Set available dates, block dates, and configure working hours.</p>
        <div class="d-flex justify-content-center gap-2 mt-3">
            <a class="btn btn-outline-dark" href="/vendor/dashboard">Back to Dashboard</a>
            <button class="btn btn-dark" onclick="loadAvailability()">Reload</button>
        </div>
    </section>

    <div id="messageBox" class="alert d-none"></div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="panel">
                <h3 class="mb-4" style="font-family:'Cormorant Garamond', serif;">Set Availability</h3>
                <label class="field-label">Date</label>
                <input class="field-input" id="date" type="date">
                <label class="field-label">Status</label>
                <select class="field-select" id="status">
                    <option value="AVAILABLE">Available</option>
                    <option value="BLOCKED">Blocked</option>
                    <option value="BOOKED">Booked</option>
                </select>
                <label class="field-label">Start Time</label>
                <input class="field-input" id="startTime" type="time">
                <label class="field-label">End Time</label>
                <input class="field-input" id="endTime" type="time">
                <label class="field-label">Reason</label>
                <input class="field-input" id="reason" type="text">
                <button class="btn btn-dark" onclick="saveAvailability()">Save</button>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="panel mb-4">
                <h3 class="mb-4" style="font-family:'Cormorant Garamond', serif;">Working Hours</h3>
                <div class="row g-2">
                    <div class="col-md-4">
                        <select class="field-select" id="workingDay">
                            <option value="MONDAY">Monday</option>
                            <option value="TUESDAY">Tuesday</option>
                            <option value="WEDNESDAY">Wednesday</option>
                            <option value="THURSDAY">Thursday</option>
                            <option value="FRIDAY">Friday</option>
                            <option value="SATURDAY">Saturday</option>
                            <option value="SUNDAY">Sunday</option>
                        </select>
                    </div>
                    <div class="col-md-4"><input class="field-input" id="workingStart" type="time"></div>
                    <div class="col-md-4"><input class="field-input" id="workingEnd" type="time"></div>
                </div>
                <button class="btn btn-outline-dark" onclick="saveWorkingHours()">Save Working Hours</button>
            </div>
            <div class="panel">
                <h3 class="mb-4" style="font-family:'Cormorant Garamond', serif;">Calendar Entries</h3>
                <div id="availabilityList"></div>
            </div>
        </div>
    </div>
</div>
<script>
    function showMessage(message, type = 'success') {
        const box = document.getElementById('messageBox');
        box.className = `alert alert-${type}`;
        box.textContent = message;
        box.classList.remove('d-none');
    }

    function getEmail() {
        return localStorage.getItem('userEmail') || '';
    }

    function loadAvailability() {
        const email = getEmail();
        fetch(`/api/vendor/availability?email=${encodeURIComponent(email)}`)
            .then(response => response.json())
            .then(items => {
                const list = document.getElementById('availabilityList');
                list.innerHTML = '';
                if (!items.length) {
                    list.innerHTML = '<p class="small-muted mb-0">No availability entries yet.</p>';
                    return;
                }
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'availability-item';
                    card.innerHTML = `
                        <div class="d-flex justify-content-between flex-wrap gap-3">
                            <div>
                                <strong>${item.dateAvailable || item.dayOfWeek || ''}</strong>
                                <div class="small-muted">Status: ${item.status || ''}</div>
                                <div class="small-muted">${item.startTime || ''} ${item.endTime ? '- ' + item.endTime : ''}</div>
                                <div class="small-muted">${item.reason || ''}</div>
                            </div>
                            <div class="d-flex gap-2 flex-wrap">
                                <button class="btn btn-outline-dark btn-sm" onclick="blockDate('${item.dateAvailable}')">Block</button>
                                <button class="btn btn-outline-dark btn-sm" onclick="unblockDate('${item.dateAvailable}')">Unblock</button>
                            </div>
                        </div>
                    `;
                    list.appendChild(card);
                });
            })
            .catch(() => showMessage('Could not load availability.', 'danger'));
    }

    function saveAvailability() {
        const email = getEmail();
        const params = new URLSearchParams({
            email,
            date: document.getElementById('date').value,
            status: document.getElementById('status').value,
            startTime: document.getElementById('startTime').value,
            endTime: document.getElementById('endTime').value,
            reason: document.getElementById('reason').value
        });

        fetch('/api/vendor/availability', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
        })
            .then(response => response.json())
            .then(() => {
                showMessage('Availability saved.', 'success');
                loadAvailability();
            })
            .catch(() => showMessage('Could not save availability.', 'danger'));
    }

    function blockDate(date) {
        const email = getEmail();
        fetch(`/api/vendor/availability/block?email=${encodeURIComponent(email)}&date=${date}`, { method: 'POST' })
            .then(response => response.json())
            .then(() => {
                showMessage('Date blocked.', 'success');
                loadAvailability();
            })
            .catch(() => showMessage('Could not block date.', 'danger'));
    }

    function unblockDate(date) {
        const email = getEmail();
        fetch(`/api/vendor/availability/unblock?email=${encodeURIComponent(email)}&date=${date}`, { method: 'POST' })
            .then(response => response.json())
            .then(() => {
                showMessage('Date unblocked.', 'success');
                loadAvailability();
            })
            .catch(() => showMessage('Could not unblock date.', 'danger'));
    }

    function saveWorkingHours() {
        const email = getEmail();
        const params = new URLSearchParams({
            email,
            dayOfWeek: document.getElementById('workingDay').value,
            startTime: document.getElementById('workingStart').value,
            endTime: document.getElementById('workingEnd').value
        });
        fetch('/api/vendor/availability/working-hours', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
        })
            .then(response => response.json())
            .then(() => {
                showMessage('Working hours saved.', 'success');
                loadAvailability();
            })
            .catch(() => showMessage('Could not save working hours.', 'danger'));
    }

    loadAvailability();
</script>
</body>
</html>
