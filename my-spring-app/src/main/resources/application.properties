spring.application.name=my-spring-app

# ============================================
# TEXT FILE PERSISTENCE CONFIGURATION
# ============================================
# Disable datasource and JPA auto-configuration to use plain text files instead of PostgreSQL
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=8080
server.servlet.context-path=/

# ============================================
# SECURITY & JWT
# ============================================
jwt.secret=your_super_secret_key_that_should_be_at_least_256_bits_long_for_security
jwt.expiration=86400000

# ============================================
# EMAIL CONFIGURATION
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================
# FILE UPLOAD
# ============================================
file.upload-dir=uploads/
max.file.size=10485760

# ============================================
# APPLICATION SETTINGS
# ============================================
app.name=Wedding Planner
app.version=1.0.0

